# Provider definitions used by spec2code.
#
# Custom model configuration:
# 1) Add (or reuse) a provider under `providers`.
# 2) Add a model under `models` and reference the provider name.
# 3) Use the model key in input config `llms_used`. The GUI discovers provider
#    models live and does not display these static custom entries.
#
# You can override this file path with:
#   SPEC2CODE_LLM_CONFIG=/path/to/llm_providers.yaml

providers:
  ollama_local:
    type: ollama
    base_url: http://localhost:11434/v1
    base_url_env: OLLAMA_BASE_URL
    api_key: ollama
    api_key_env: OLLAMA_API_KEY

  vllm_local:
    type: openai-compatible
    base_url: http://localhost:8000/v1
    base_url_env: VLLM_BASE_URL
    api_key: not-required
    api_key_env: VLLM_API_KEY

  openai_default:
    type: openai-compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

models: {}
