services:
  spec2code:
    build:
      context: .
      dockerfile: dockerfile
    image: spec2code:local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./spec2code-workspace:/data
    environment:
      SPEC2CODE_WORKSPACE_ROOT: /data
      SPEC2CODE_OUTPUT_ROOT: /data/output
      SPEC2CODE_INPUT_ROOT: /data/input
      SPEC2CODE_CASE_STUDIES_ROOT: /data/projects
      SPEC2CODE_GUI_SETTINGS_PATH: /data/settings/gui_settings.json
    command:
      - python3
      - -m
      - spec2code.gui.run_server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
